name: 指数动量推送

on:
  schedule:
    - cron: '45 6 * * 1-5'  # 北京时间14:45
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python ql_index_momentum.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
